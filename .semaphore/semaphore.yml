version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: "\U0001F9EA Test"
    dependencies: []
    task:
      secrets:
        - name: sample-org-secret
        - name: sample-project-secret
        - name: rsv-test-reserved
        - name: project secret
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - echo "Checking out code..."
            - echo "Installing dependencies..."
            - echo "Running test suite..."
            - echo "Tests completed successfully!"
        - name: OIDC TOKEN PAYLOAD
          commands:
            - PAYLOAD=$(echo $SEMAPHORE_OIDC_TOKEN | cut -d "." -f 2 | base64 -d | jq . 2>/dev/null) || true
            - echo "OIDC Payload=$PAYLOAD"
        - name: Secrets
          commands:
            - |
              missing=""
              for var in SAMPLE_ORG_TOKEN SAMPLE_ORG_ENV SAMPLE_PROJECT_TOKEN SAMPLE_PROJECT_ENV; do
                if [ -n "${!var}" ]; then echo "$var: set"; else echo "$var: MISSING"; missing="$missing $var"; fi
              done
              if [ -n "$missing" ]; then echo "Secrets not injected:$missing"; exit 1; fi
  - name: Cache
    dependencies: []
    task:
      jobs:
        - name: Cache round trip
          commands:
            - |
              key="sem-approve-probe-$SEMAPHORE_WORKFLOW_ID"
              mkdir -p probe && echo "$key" > probe/probe.txt
              cache store "$key" probe || { echo "Cache store failed"; exit 1; }
              rm -rf probe
              cache restore "$key" || { echo "Cache restore failed"; exit 1; }
              if [ "$(cat probe/probe.txt 2>/dev/null)" != "$key" ]; then echo "Cache round trip failed: probe file not restored"; exit 1; fi
              cache delete "$key" || true
              echo "Cache available"
      secrets:
        - name: 'aws Cache '
        - name: project secret
        - name: rsv-test-reserved
        - name: sample-org-secret
        - name: sample-project-secret
